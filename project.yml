name: VideoCompressor
options:
  bundleIdPrefix: com.automatrix
  deploymentTarget:
    iOS: "16.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 8KHYA6SXUA
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: "retake."
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Used to save your compressed or edited video back to your library."
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Used only to delete the original video when you explicitly choose to, after compressing it."
    INFOPLIST_KEY_NSCameraUsageDescription: "Used to record video with the built-in teleprompter."
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "Used to record audio while filming with the built-in teleprompter."
    DEVELOPMENT_LANGUAGE: en
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  FFmpegKitSPM:
    url: https://github.com/tylerjonesio/ffmpeg-kit-spm
    exactVersion: 5.1.2
targets:
  VideoCompressor:
    type: application
    platform: iOS
    sources:
      - path: VideoCompressor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.automatrix.videocompressor
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "retake distribution"
          DEVELOPMENT_TEAM: 8KHYA6SXUA
    dependencies:
      - package: FFmpegKitSPM
        product: FFmpeg-Kit
        embed: true
        codeSign: true
  VideoCompressorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VideoCompressorTests
    dependencies:
      - target: VideoCompressor
schemes:
  VideoCompressor:
    build:
      targets:
        VideoCompressor: all
        VideoCompressorTests: [test]
    test:
      targets:
        - VideoCompressorTests
    run:
      config: Debug
